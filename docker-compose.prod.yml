# Production stack: Postgres + API + Web.
# Caddy on the host terminates TLS and reverse-proxies to web:3000.
# See README.md "Deploy on VPS (Docker + Caddy)".

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heritage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-heritage}
    volumes:
      - heritage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-heritage} -d ${POSTGRES_DB:-heritage}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - heritage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-heritage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-heritage}?schema=public
      UPLOAD_DIR: uploads
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_SITE_URL:-https://heritage.nobatix.ir}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_SITE_URL:-https://heritage.nobatix.ir}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_MIRROR_WEB: '0'
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'
    networks:
      - heritage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://heritage.nobatix.ir}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://heritage.nobatix.ir}
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - heritage

volumes:
  heritage_pgdata:
  api_uploads:

networks:
  heritage:
    driver: bridge
